  <script>(function(){var s=localStorage.getItem('wv-theme');document.documentElement.dataset.theme=s||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')})();</script>
  <script defer src="/chrome.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    :root {
      --black:  #0C0C0B;
      --white:  #FAF9F7;
      --ink:    #FAF9F7;
      --stone:  #9A9890;
      --rule:   #2A2826;
      --bg:     #000000;
      --bg2:    #0D0D0D;
      --serif:  'EB Garamond', Georgia, serif;
      --sans:   'Inter', system-ui, sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── Light mode ── */
    [data-theme="light"] {
      --ink: #0C0C0B; --stone: #6B6560; --rule: #D5D1CB;
      --bg: #F5F3EF; --bg2: #EDEAE5;
    }
    [data-theme="light"] body { background: #F5F3EF; }
    [data-theme="light"] nav { background: rgba(245,243,239,0.95); }
    [data-theme="light"] .nav-logo img { filter: invert(1); opacity: 1; }
    [data-theme="light"] .nav-links a:hover { color: var(--ink); }
    [data-theme="light"] .theme-toggle { border-color: #D5D1CB; }
    [data-theme="light"] .toggle-thumb .icon-moon { display: none; }
    [data-theme="light"] .toggle-thumb .icon-sun  { display: block; }
    [data-theme="light"] .nav-cta { color: #0C0C0B !important; border-color: #D5D1CB !important; }
    [data-theme="light"] .nav-cta:hover { background: #0C0C0B !important; color: #FAF9F7 !important; border-color: #0C0C0B !important; }
    [data-theme="light"] .footer-admin:hover { color: #0C0C0B; border-color: #6B6560; }
    [data-theme="light"] .footer-social .social-icons a:hover { color: var(--ink); }

    /* ── Page layout ── */
    .page-wrap {
      padding: calc(100px + 64px) 48px 100px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Page header ── */
    .page-head {
      margin-bottom: 64px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--rule);
    }
    .page-head-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
    }
    .page-head h1 {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      line-height: 1.05;
    }
    .back-link {
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--stone);
      transition: color 0.2s;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--ink); }
    .page-intro {
      max-width: 680px;
      font-size: 1.05rem;
      color: var(--stone);
      line-height: 1.75;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 20px;
    }

    /* ── Client strip ── */
    .clients-section { margin-bottom: 80px; }
    .clients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule);
    }
    .client-chip {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--stone);
      padding: 14px 24px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      transition: color 0.2s, background 0.2s;
    }
    .client-chip:hover { color: var(--ink); background: var(--bg2); }

    /* ── Discipline sections ── */
    .discipline-section { margin-bottom: 80px; }
    .discipline-header {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--rule);
    }
    .discipline-title {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 400;
      line-height: 1.1;
    }
    .discipline-count {
      font-size: 11px;
      letter-spacing: 0.10em;
      color: var(--stone);
    }

    /* ── Shot grid (Dribbble) ── */
    .shot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
    }
    .shot-card {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transition: background 0.2s;
      cursor: pointer;
    }
    .shot-card:hover { background: var(--bg2); }

    .shot-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 32px;
    }
    .shot-preview-bg {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--rule) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .shot-preview-title {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      font-style: italic;
      font-weight: 400;
      color: var(--stone);
      text-align: center;
      line-height: 1.25;
      position: relative;
      z-index: 1;
      transition: color 0.25s;
    }
    .shot-card:hover .shot-preview-title { color: var(--ink); }
    .shot-preview-cta {
      position: relative;
      z-index: 1;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stone);
      opacity: 0.5;
      transition: opacity 0.25s;
    }
    .shot-card:hover .shot-preview-cta { opacity: 1; }

    .shot-info {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .shot-info-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .shot-title {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 400;
    }
    .shot-link {
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--stone);
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .shot-card:hover .shot-link { color: var(--ink); }
    .shot-meta {
      font-size: 11px;
      color: var(--stone);
      opacity: 0.7;
    }

    /* ── Case study grid (E-Commerce / Digital Marketing) ── */
    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
    }
    .case-card {
      background: var(--bg);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: background 0.2s;
      position: relative;
    }
    .case-card:hover { background: var(--bg2); }
    .case-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 16px;
    }
    .case-client {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .case-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
      background: #fff;
      padding: 2px;
    }
    .case-roi {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 4vw, 3.6rem);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 4px;
    }
    .case-roi-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 20px;
    }
    .case-desc {
      font-size: 12px;
      color: var(--stone);
      line-height: 1.65;
      flex: 1;
      margin-bottom: 20px;
    }
    .case-link {
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--stone);
      transition: color 0.2s;
      align-self: flex-start;
    }
    .case-card:hover .case-link { color: var(--ink); }

    /* ── App cards ── */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
    }
    .app-card {
      background: var(--bg);
      padding: 40px 40px;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      transition: background 0.2s;
    }
    .app-card:hover { background: var(--bg2); }
    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .app-body { flex: 1; min-width: 0; }
    .app-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 8px;
    }
    .app-name {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .app-tagline {
      font-size: 13px;
      color: var(--stone);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .app-links { display: flex; gap: 12px; flex-wrap: wrap; }
    .app-link {
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--stone);
      padding: 7px 14px;
      border: 1px solid var(--rule);
      transition: border-color 0.2s, color 0.2s;
    }
    .app-card:hover .app-link { border-color: var(--stone); }
    .app-link:hover { color: var(--ink) !important; border-color: var(--ink) !important; }

    /* ── Awards strip ── */
    .awards-section { margin-bottom: 80px; }
    .awards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
    }
    .award-item {
      background: var(--bg);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.2s;
    }
    .award-item:hover { background: var(--bg2); }
    .award-year {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
    }
    .award-title {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.25;
    }
    .award-org {
      font-size: 12px;
      color: var(--stone);
      margin-top: 4px;
    }

    /* ── Profile CTAs ── */
    .profile-ctas {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
      margin-top: 80px;
    }
    .profile-cta {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 40px;
      gap: 24px;
      transition: background 0.2s;
    }
    .profile-cta:hover { background: var(--bg2); }
    .profile-cta-body {}
    .profile-cta-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 8px;
    }
    .profile-cta-name {
      font-family: var(--serif);
      font-size: 1.8rem;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 10px;
    }
    .profile-cta-desc {
      font-size: 13px;
      color: var(--stone);
      line-height: 1.6;
      max-width: 280px;
    }
    .profile-cta-arrow {
      font-size: 2rem;
      color: var(--stone);
      flex-shrink: 0;
      transition: color 0.2s, transform 0.2s;
    }
    .profile-cta:hover .profile-cta-arrow { color: var(--ink); transform: translate(4px, -4px); }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .profile-ctas { grid-template-columns: 1fr 1fr; }
      .awards-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 900px) {
      nav { padding: 0 24px; height: 50px; }
      .nav-logo img { height: 28px; }
      .nav-links { gap: 20px; }
      .nav-link-hide { display: none; }
      .theme-toggle { width: auto; height: auto; border: none; padding: 4px; }
      .toggle-thumb { position: static; width: auto; height: auto; background: none; border-radius: 0; transform: none !important; }
      .toggle-thumb .icon-moon,
      .toggle-thumb .icon-sun { width: 17px; height: 17px; stroke: var(--stone); }
      .theme-toggle:hover .toggle-thumb .icon-moon,
      .theme-toggle:hover .toggle-thumb .icon-sun { stroke: var(--ink); }
      .page-wrap { padding: calc(50px + 40px) 24px 80px; }
      .shot-grid { grid-template-columns: 1fr; }
      .case-grid { grid-template-columns: 1fr 1fr; }
      .profile-ctas { grid-template-columns: 1fr; }
      .awards-grid { grid-template-columns: 1fr; }
      .app-grid { grid-template-columns: 1fr; }
      footer { padding: 40px 24px 88px; flex-direction: column; gap: 28px; }
      .footer-admin { position: static; transform: none; order: 1; }
      .footer-social { order: 0; }
      .footer-mark { position: static; transform: none; order: 2; }
    }
    @media (max-width: 620px) {
      .case-grid { grid-template-columns: 1fr; }
      .app-card { flex-direction: column; gap: 20px; }
      .profile-cta { padding: 32px 24px; }
      .profile-cta-name { font-size: 1.5rem; }
      .footer-admin { display: none; }
    }
    /* Custom hand pointer, site-wide */
    html, body, body * { cursor: url('/images/pointer_up.png') 3 1, auto !important; }
    body *:active { cursor: url('/images/pointer_down.png') 3 1, auto !important; }
    input[type="text"], input[type="email"], input[type="search"], input[type="tel"], input[type="number"], input[type="url"], input[type="password"], textarea, [contenteditable="true"] { cursor: text !important; }
  
    /* Smooth cross-page transitions (Chrome MPA view transitions; ignored elsewhere) */
    @view-transition { navigation: auto; }
    /* Respect the visitor's reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    }
</style>
</head>
<body>

  <style>
    .uc { min-height: calc(100vh - 100px); display: flex; align-items: center; justify-content: center; padding: clamp(96px, 14vh, 160px) 24px 80px; text-align: center; }
    .uc-inner { max-width: 720px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 3vw, 30px); }
    .uc-video { width: min(420px, 74vw); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 50%; background: transparent; display: block; }
    .uc-eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--stone); }
    .uc-title { font-family: var(--serif); font-weight: 400; font-size: clamp(1.5rem, 4.2vw, 2.6rem); line-height: 1.18; letter-spacing: -0.01em; color: var(--ink); max-width: 20ch; }
    .uc-note { font-family: var(--serif); font-style: italic; font-size: clamp(1.05rem, 2.2vw, 1.35rem); color: var(--stone); }
    .uc-back { margin-top: 6px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); border-bottom: 1px solid var(--rule); padding-bottom: 4px; transition: color 0.2s, border-color 0.2s; }
    .uc-back:hover { color: var(--ink); border-color: var(--ink); }
  </style>

  <main class="uc">
    <div class="uc-inner">
      <video class="uc-video" autoplay loop muted playsinline preload="auto">
        <source src="/waltviviers_.mp4" type="video/mp4" />
      </video>
      <p class="uc-eyebrow">Design &amp; Digital</p>
      <h1 class="uc-title">I&rsquo;m still busy polishing my portfolio section</h1>
      <p class="uc-note">(you know how designers can be about that)</p>
      <a href="/" class="uc-back">&larr; Back to the work</a>
    </div>
  </main>

    <!-- The portrait tilts gently toward the pointer (desktop, motion-friendly). -->
    <script>
    (function () {
      var v = document.querySelector('.uc-video');
      if (!v) return;
      if (!window.matchMedia('(pointer: fine)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      v.style.transition = 'transform 0.25s ease-out';
      v.style.willChange = 'transform';
      var raf = false, rx = 0, ry = 0;
      function apply() {
        raf = false;
        v.style.transform = 'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
      }
      window.addEventListener('mousemove', function (e) {
        var cx = e.clientX / (window.innerWidth || 1) - 0.5;
        var cy = e.clientY / (window.innerHeight || 1) - 0.5;
        ry = cx * 22;    // ±11deg
        rx = -cy * 22;
        if (!raf) { raf = true; requestAnimationFrame(apply); }
      }, { passive: true });
    })();
    </script>

    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
