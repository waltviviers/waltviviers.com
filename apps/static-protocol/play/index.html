<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>Static Protocol — Play</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    color: #d9f7f2;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  :root {
    --cyan: #22e6d4;
    --cyan-dim: rgba(34,230,212,0.28);
    --magenta: #ff3d94;
    --amber: #ffcf3d;
    --danger: #ff4d4d;
    --bg: #05050a;
    --panel: #0b0c16;
    --panel-line: rgba(34,230,212,0.22);
  }

  /* Custom hand pointer, site-wide */
  html, body, body * { cursor: url('/images/pointer_up.png') 3 1, auto !important; }
  body *:active { cursor: url('/images/pointer_down.png') 3 1, auto !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  #app {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* ── Scene backdrop: the current scene's art fills the whole screen; the panel floats over it ── */
  #scene-backdrop {
    position: fixed; inset: 0; z-index: 1;
    opacity: 0; transition: opacity 0.5s ease;
  }
  #scene-backdrop svg { width: 100%; height: 100%; display: block; }
  #scene-backdrop::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(34,230,212,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(255,61,148,0.08), transparent 55%),
      linear-gradient(180deg, rgba(5,5,10,0.25) 0%, rgba(5,5,10,0.4) 60%, rgba(5,5,10,0.7) 100%);
  }
  .scene-rain { animation: rainfall 3.4s linear infinite; }
  @keyframes rainfall { from { transform: translate(0, -18px); } to { transform: translate(-5px, 18px); } }

  /* ── Hand prop: your own gloved hand, always in frame, reaches for whatever you interact with ── */
  .hand-prop {
    position: fixed; right: -18px; bottom: -22px; z-index: 3; width: clamp(150px, 34vw, 220px);
    pointer-events: none; filter: drop-shadow(0 -6px 20px rgba(34,230,212,0.18));
    transform-origin: 78% 90%;
    animation: handIdle 3.4s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.3,0,0.4,1);
    opacity: 0;
  }
  .hand-prop.visible { opacity: 1; transition: opacity 0.6s ease, transform 0.3s cubic-bezier(0.3,0,0.4,1); }
  .hand-prop svg { width: 100%; height: 100%; display: block; }
  @keyframes handIdle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-1.2deg); } }
  .hand-prop.peek-left   { animation: none; transform: translate(-70px, -50px) rotate(-10deg); }
  .hand-prop.peek-center { animation: none; transform: translate(-30px, -64px) rotate(-4deg); }
  .hand-prop.peek-right  { animation: none; transform: translate(6px, -58px) rotate(3deg); }
  .hand-prop.reach-left   { animation: none; transition: transform 0.26s cubic-bezier(0.3,0,0.5,1); transform: translate(-130px, -110px) rotate(-16deg) scale(1.05); }
  .hand-prop.reach-center { animation: none; transition: transform 0.26s cubic-bezier(0.3,0,0.5,1); transform: translate(-60px, -140px) rotate(-6deg) scale(1.05); }
  .hand-prop.reach-right  { animation: none; transition: transform 0.26s cubic-bezier(0.3,0,0.5,1); transform: translate(14px, -125px) rotate(5deg) scale(1.05); }

  /* ── Hotspots: interactive targets drawn inside the scene SVG itself ── */
  .hotspot-group { cursor: pointer; outline: none; }
  .hotspot-ring { fill: rgba(255,255,255,0.02); stroke-width: 2; animation: hotspotPulse 2.2s ease-in-out infinite; transition: stroke-width 0.15s, fill 0.15s; }
  .hotspot-group:hover .hotspot-ring, .hotspot-group.is-hovered .hotspot-ring { stroke-width: 3.5; fill: rgba(255,255,255,0.06); }
  .hotspot-icon { transition: transform 0.15s ease; transform-box: fill-box; transform-origin: center; }
  .hotspot-group:hover .hotspot-icon, .hotspot-group.is-hovered .hotspot-icon { transform: scale(1.12); }
  @keyframes hotspotPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  /* ── Scene caption: a slim docked strip instead of a full card, so the scene stays primary ── */
  .scene-caption {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 640px; z-index: 20;
    background: rgba(9,10,18,0.68); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid var(--panel-line); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    padding: 16px 20px; max-height: 42vh; overflow-y: auto;
  }
  .scene-caption .prose p { font-size: 13px; line-height: 1.65; margin-bottom: 10px; }
  .hover-hint { margin-top: 4px; font-size: 12px; color: var(--cyan); letter-spacing: 0.03em; min-height: 16px; }
  .hover-hint.idle { color: rgba(217,247,242,0.4); }

  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.028) 0px, rgba(255,255,255,0.028) 1px, transparent 2px, transparent 4px);
    mix-blend-mode: overlay;
    animation: flicker 6s linear infinite;
  }
  @keyframes flicker { 0%,100% { opacity: 0.9; } 50% { opacity: 1; } 92% { opacity: 0.6; } }

  #exit-link {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); z-index: 40;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(217,247,242,0.45); text-decoration: none; border: 1px solid rgba(217,247,242,0.18);
    padding: 7px 12px; transition: color 0.2s, border-color 0.2s;
  }
  #exit-link:hover { color: var(--cyan); border-color: var(--cyan-dim); }

  #hud-bar {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 40;
    display: flex; align-items: center; gap: 12px;
    font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(217,247,242,0.5);
  }
  #hunted-meter { display: flex; gap: 3px; }
  #hunted-meter span { width: 8px; height: 8px; border: 1px solid rgba(255,77,77,0.5); background: transparent; }
  #hunted-meter span.on { background: var(--danger); box-shadow: 0 0 8px var(--danger); border-color: var(--danger); }

  #stage { width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; z-index: 10; }

  .panel {
    background: rgba(9,10,18,0.62);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--panel-line);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(34,230,212,0.06);
    padding: 40px 32px;
  }

  .glitch {
    position: relative;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #eafffb;
    text-shadow: 0 0 18px rgba(34,230,212,0.35);
  }
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0; width: 100%;
    overflow: hidden; opacity: 0.7;
  }
  .glitch::before { color: var(--cyan); transform: translate(-1px,0); animation: glitch1 3.2s infinite steps(1); clip-path: inset(0 0 55% 0); }
  .glitch::after  { color: var(--magenta); transform: translate(1px,0); animation: glitch2 3.6s infinite steps(1); clip-path: inset(55% 0 0 0); }
  @keyframes glitch1 { 0%,90%,100% { transform: translate(-1px,0); } 92% { transform: translate(2px,-1px); } 94% { transform: translate(-3px,1px); } 96% { transform: translate(1px,1px); } }
  @keyframes glitch2 { 0%,88%,100% { transform: translate(1px,0); } 91% { transform: translate(-2px,1px); } 95% { transform: translate(3px,-1px); } 97% { transform: translate(-1px,-1px); } }

  .eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cyan); margin-bottom: 14px; }
  .eyebrow.magenta { color: var(--magenta); }

  h1.title { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin-bottom: 16px; }
  h2.node-title { font-size: clamp(1.2rem, 4vw, 1.7rem); line-height: 1.15; margin-bottom: 20px; color: #eafffb; }

  .tagline { color: rgba(217,247,242,0.65); font-size: 14px; margin-bottom: 28px; line-height: 1.7; }
  .prose p { color: rgba(217,247,242,0.82); font-size: 14.5px; line-height: 1.85; margin-bottom: 16px; }
  .prose p:last-child { margin-bottom: 0; }

  .primary-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--cyan); color: #05050a; font-weight: 700; letter-spacing: 0.10em;
    text-transform: uppercase; font-size: 12.5px; padding: 15px 30px; border: none; margin-top: 8px;
    transition: box-shadow 0.2s, transform 0.1s;
    box-shadow: 0 0 22px rgba(34,230,212,0.35);
  }
  .primary-btn:hover { box-shadow: 0 0 32px rgba(34,230,212,0.55); }
  .primary-btn:active { transform: scale(0.98); }

  .ghost-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--panel-line); color: rgba(217,247,242,0.7);
    font-size: 11.5px; letter-spacing: 0.10em; text-transform: uppercase; padding: 12px 22px; margin-top: 12px;
    transition: border-color 0.2s, color 0.2s;
  }
  .ghost-btn:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ── Sync overlay ── */
  .sync-label { font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase; color: var(--magenta); text-align: center; margin-bottom: 6px; }
  .sync-sub { font-size: 11px; color: rgba(217,247,242,0.45); text-align: center; margin-bottom: 26px; letter-spacing: 0.05em; }

  .sync-arena { display: flex; flex-direction: column; align-items: center; gap: 26px; }

  .ring-wrap { position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
  .ring-track, .ring-fill { position: absolute; inset: 0; border-radius: 50%; }
  .ring-track { border: 2px solid rgba(217,247,242,0.12); }
  .ring-fill {
    border: 2px solid var(--cyan);
    box-shadow: 0 0 18px rgba(34,230,212,0.55);
    transform: scale(1);
    transition: transform linear, border-color linear;
  }
  .ring-fill.late { border-color: var(--amber); box-shadow: 0 0 18px rgba(255,207,61,0.5); }
  .ring-glyph { position: relative; z-index: 2; font-size: 34px; font-weight: 800; color: #eafffb; }
  .ring-glyph.flash-hit { color: var(--cyan); }
  .ring-glyph.flash-miss { color: var(--danger); }
  .ring-glyph.flash-late { color: var(--amber); }

  .memory-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 340px; }
  .memory-slot {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(217,247,242,0.18); font-size: 16px; font-weight: 700; color: rgba(217,247,242,0.3);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .memory-slot.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(34,230,212,0.5); background: rgba(34,230,212,0.08); }
  .memory-slot.hit { border-color: var(--cyan); color: var(--cyan); background: rgba(34,230,212,0.12); }
  .memory-slot.miss { border-color: var(--danger); color: var(--danger); background: rgba(255,77,77,0.10); }

  .progress-bar { width: 260px; height: 4px; background: rgba(217,247,242,0.12); position: relative; overflow: hidden; }
  .progress-fill { position: absolute; inset: 0; background: var(--cyan); transform-origin: left; transform: scaleX(1); transition: transform linear; }

  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; }
  .dpad button {
    background: rgba(34,230,212,0.05); border: 1px solid var(--panel-line); color: #eafffb;
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, border-color 0.1s, transform 0.08s;
  }
  .dpad button:active { transform: scale(0.92); background: rgba(34,230,212,0.18); }
  .dpad .d-up { grid-column: 2; grid-row: 1; }
  .dpad .d-left { grid-column: 1; grid-row: 2; }
  .dpad .d-down { grid-column: 2; grid-row: 2; }
  .dpad .d-right { grid-column: 3; grid-row: 2; }
  .key-hint { font-size: 10px; color: rgba(217,247,242,0.35); letter-spacing: 0.08em; text-align: center; }

  /* ── HUD / debrief ── */
  .flag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 26px 0; }
  .flag-box { border: 1px solid var(--panel-line); padding: 12px 14px; }
  .flag-box .fk { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(217,247,242,0.4); margin-bottom: 6px; }
  .flag-box .fv { font-size: 13px; color: var(--cyan); }
  .sync-log { display: flex; gap: 6px; margin-top: 4px; }
  .sync-log span { width: 9px; height: 9px; border-radius: 50%; }
  .sync-log span.clean { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .sync-log span.partial { background: var(--amber); }
  .sync-log span.fail { background: var(--danger); }

  .screen { display: none; }
  .screen.active { display: block; animation: fadein 0.35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(34,230,212,0.25); }

  @media (max-width: 480px) {
    .panel { padding: 30px 20px; }
    .flag-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="scene-backdrop" aria-hidden="true"></div>
  <div class="hand-prop" id="hand-prop" aria-hidden="true"></div>
  <div id="scanlines" aria-hidden="true"></div>
  <a id="exit-link" href="/apps/static-protocol/">← Disconnect</a>
  <div id="hud-bar">
    <span>Hunted</span>
    <span id="hunted-meter"></span>
  </div>
  <div id="stage"></div>
</div>

<script>
'use strict';

/* ── Glyph set (react + memory SYNC input) ── */
var GLYPHS = [
  { sym: '▲', key: 'up',    keys: ['ArrowUp','w','W'] },
  { sym: '▼', key: 'down',  keys: ['ArrowDown','s','S'] },
  { sym: '◀', key: 'left',  keys: ['ArrowLeft','a','A'] },
  { sym: '▶', key: 'right', keys: ['ArrowRight','d','D'] }
];
function glyphByKey(k) { for (var i=0;i<GLYPHS.length;i++) if (GLYPHS[i].keys.indexOf(k) !== -1) return GLYPHS[i]; return null; }
function randomGlyph(prev) {
  var g;
  do { g = GLYPHS[Math.floor(Math.random()*GLYPHS.length)]; } while (GLYPHS.length > 1 && prev && g.key === prev.key);
  return g;
}

/* ── Scene art: one reusable skyline, recoloured + a small motif per scene ── */
var svgIdCounter = 0;
var MOTIFS = {
  drone: function (a) { return '<g transform="translate(300,34)" fill="none" stroke="' + a + '" stroke-width="2"><rect x="-15" y="-5" width="30" height="9" rx="3"/><circle cx="-15" cy="-0.5" r="3" fill="' + a + '"/><circle cx="15" cy="-0.5" r="3" fill="' + a + '"/><line x1="0" y1="4" x2="0" y2="12"/></g>'; },
  door: function (a) { return '<g transform="translate(300,32)" fill="none" stroke="' + a + '" stroke-width="2"><rect x="-16" y="-20" width="32" height="42" rx="2"/><line x1="-16" y1="2" x2="16" y2="2"/><line x1="0" y1="-20" x2="0" y2="22"/></g>'; },
  circuit: function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><path d="M270 20 h20 v16 h24 v14"/><circle cx="270" cy="20" r="3" fill="' + a + '"/><circle cx="314" cy="50" r="3" fill="' + a + '"/><path d="M330 16 h-14 v20 h-18"/><circle cx="330" cy="16" r="3" fill="' + a + '"/><circle cx="298" cy="36" r="3" fill="' + a + '"/></g>'; },
  warning: function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2" stroke-linejoin="round"><polygon points="300,14 318,44 282,44"/><line x1="300" y1="23" x2="300" y2="35"/><circle cx="300" cy="39.5" r="1.7" fill="' + a + '" stroke="none"/></g>'; },
  tower: function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><line x1="300" y1="10" x2="300" y2="48"/><line x1="292" y1="48" x2="308" y2="48"/><path d="M288 26 a17 17 0 0 1 24 0" stroke-opacity="0.7"/><path d="M282 18 a26 26 0 0 1 36 0" stroke-opacity="0.4"/></g>'; },
  none: function () { return ''; }
};

/* ── Hotspot icons: the objects/people you can reach for inside a scene ── */
var ICONS = {
  drone:  function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><rect x="-15" y="-5" width="30" height="9" rx="3"/><circle cx="-15" cy="-0.5" r="3" fill="' + a + '"/><circle cx="15" cy="-0.5" r="3" fill="' + a + '"/><line x1="0" y1="4" x2="0" y2="12"/></g>'; },
  door:   function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><rect x="-16" y="-20" width="32" height="42" rx="2"/><line x1="-16" y1="2" x2="16" y2="2"/><line x1="0" y1="-20" x2="0" y2="22"/></g>'; },
  tower:  function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><line x1="0" y1="-24" x2="0" y2="14"/><line x1="-8" y1="14" x2="8" y2="14"/><path d="M-12 -4 a17 17 0 0 1 24 0" stroke-opacity="0.75"/><path d="M-18 -12 a26 26 0 0 1 36 0" stroke-opacity="0.45"/></g>'; },
  shadow: function (a) { return '<g><circle r="22" fill="#05050a" opacity="0.55"/><path d="M-9,-7 L0,8 L9,-7" stroke="' + a + '" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>'; },
  signal: function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><circle cx="0" cy="6" r="3.4" fill="' + a + '" stroke="none"/><path d="M-11 -1 a15 15 0 0 1 22 0" opacity="0.85"/><path d="M-18 -8 a24 24 0 0 1 36 0" opacity="0.5"/></g>'; },
  seal:   function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><polygon points="0,-19 16,-9.5 16,9.5 0,19 -16,9.5 -16,-9.5"/><circle cx="0" cy="0" r="5" fill="' + a + '" stroke="none"/></g>'; },
  drive:  function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><rect x="-15" y="-9" width="30" height="19" rx="2"/><line x1="-8" y1="10" x2="-8" y2="16"/><line x1="0" y1="10" x2="0" y2="16"/><line x1="8" y1="10" x2="8" y2="16"/></g>'; },
  terminal: function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><rect x="-17" y="-13" width="34" height="23" rx="1.5"/><line x1="-17" y1="15" x2="17" y2="15"/><line x1="-8" y1="15" x2="-10" y2="21"/><line x1="8" y1="15" x2="10" y2="21"/><line x1="-9" y1="-3" x2="3" y2="-3"/></g>'; },
  eye:    function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2"><circle r="14"/><circle r="5" fill="' + a + '" stroke="none"/><line x1="-21" y1="0" x2="-15" y2="0"/><line x1="15" y1="0" x2="21" y2="0"/><line x1="0" y1="-21" x2="0" y2="-15"/></g>'; },
  talk:   function (a) { return '<g fill="none" stroke="' + a + '" stroke-width="2" stroke-linecap="round"><path d="M-15,-9 q-7,9 0,18"/><path d="M15,-9 q7,9 0,18"/><circle cx="0" cy="0" r="3" fill="' + a + '" stroke="none"/></g>'; },
  figure: function (a) { return '<g fill="' + a + '" opacity="0.92"><circle cx="0" cy="-15" r="6.5"/><path d="M-10,20 L-7,-4 L7,-4 L10,20 Z"/></g>'; },
  flame:  function (a) { return '<path d="M0,-19 C9,-9 9,2 0,11 C-9,2 -9,-9 0,-19 Z M0,-3 C4,2 3,8 0,11 C-3,8 -4,2 0,-3 Z" fill="' + a + '"/>'; }
};
function sceneIcon(name, accent) { return ICONS[name] ? ICONS[name](accent) : ''; }

function skylineSvg(accent, motif, tall) {
  var id = 'sc' + (svgIdCounter++);
  var h = tall ? 220 : 170;
  return (
    '<svg viewBox="0 0 600 ' + h + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +

function bindHotspots(node) {

    var idx = Number(g.dataset.choiceIdx);
    var zone = g.dataset.zone;
    var label = node.choices[idx].label;
    function showHint() {
      g.classList.add('is-hovered');
      setHoverHint(label, false);
      peekHand(zone);
    }
    function hideHint() {
      g.classList.remove('is-hovered');
      setHoverHint(null, true);
      peekHand(null);
    }
    g.addEventListener('mouseenter', showHint);
    g.addEventListener('mouseleave', hideHint);
    g.addEventListener('focus', showHint);
    g.addEventListener('blur', hideHint);
    g.addEventListener('click', function () { activateChoice(node, idx, zone); });
  });
}

      method: { stealth: 0, violence: 0, words: 0 },
      hunted: 0,
      betrayed: false,
      hurt: false,
      aiAlly: false
    },
    syncLog: []
  };
}
function clearTimers() { timers.forEach(function (t) { clearTimeout(t); }); timers = []; }
function addFlags(target, delta) { for (var k in delta) { if (Object.prototype.hasOwnProperty.call(delta, k)) target[k] = (target[k] || 0) + delta[k]; } }
function dominant(obj, order) {
  var best = order[0], bestVal = obj[order[0]] || 0;
  for (var i = 1; i < order.length; i++) { var v = obj[order[i]] || 0; if (v > bestVal) { best = order[i]; bestVal = v; } }
  return best;
}

function classify(hits, lates, misses, N) {
  var failThreshold = Math.ceil(N / 2);
  if (misses >= failThreshold) return 'fail';
  if (misses === 0 && lates === 0) return 'clean';
  return 'partial';
}

function updateHuntedMeter() {
  var el = document.getElementById('hunted-meter');
  var n = Math.min(state.flags.hunted, 3);
  var html = '';
  for (var i = 0; i < 3; i++) html += '<span class="' + (i < n ? 'on' : '') + '"></span>';
  el.innerHTML = html;
}

/* ── Rendering ── */
var stage = document.getElementById('stage');
function setScreen(html) { stage.innerHTML = '<div class="screen active">' + html + '</div>'; window.scrollTo(0, 0); }

function renderTitle() {
  clearTimers();
  setBackdrop('#22e6d4', 'tower', true);
  setScreen(
    '<div class="panel">' +
      '<p class="eyebrow">Interactive cyberpunk fiction</p>' +
      '<h1 class="title glitch" data-text="STATIC PROTOCOL">STATIC PROTOCOL</h1>' +
      '<p class="tagline">Five decisions. Five live SYNC sequences. Ten possible endings. Two runners who pick the exact same path can still walk away with two different stories — it depends on how steady your hands are when it counts.</p>' +
      '<button class="primary-btn" id="start-btn">Jack In</button>' +
      '<div style="margin-top:22px;font-size:11.5px;color:rgba(217,247,242,0.45);line-height:1.7;">Each choice triggers a SYNC — a short run of timed prompts. Use ↑ ↓ ← → / WASD, or tap the glyphs on screen. Clean syncs go your way. Failed ones don\'t.</div>' +
    '</div>'
  );
  document.getElementById('start-btn').addEventListener('click', function () {
    state = freshState();
    updateHuntedMeter();
    renderNode();
  });
}

function renderNode() {
  clearTimers();
  var node = NODES[state.nodeIndex];
  peekHand(null);
  setScreen(
    '<div class="scene-caption">' +
      '<p class="eyebrow">' + node.label + '</p>' +
      '<div class="prose">' + node.scene.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
      '<p class="hover-hint idle" id="hover-hint">Look around — reach for something in the scene.</p>' +
    '</div>'
  );
  setBackdropHTML('node:' + node.id, buildSceneSVG(node), function () { bindHotspots(node); });
}

function activateChoice(node, idx, zone) {
  var choice = node.choices[idx];
  state.lastChoice = choice;
  addFlags(state.flags.method, choice.method || {});
  addFlags(state.flags.trust, choice.trust || {});
  if (node.onSelect) node.onSelect(state, choice);
  Array.prototype.forEach.call(backdropEl.querySelectorAll('.hotspot-group'), function (g) { g.style.pointerEvents = 'none'; });
  playHandReach(zone, function () { renderSyncIntro(node, choice); });
}

function renderSyncIntro(node, choice) {
  setScreen(
    '<div class="panel" style="text-align:center;">' +
      '<p class="eyebrow magenta">' + node.sync.label + '</p>' +
      '<p class="sync-sub" style="margin-bottom:22px;">' + node.sync.sub + '</p>' +
      '<button class="primary-btn" id="sync-go">Initiate SYNC</button>' +
    '</div>'
  );
  document.getElementById('sync-go').addEventListener('click', function () {
    if (node.sync.mode === 'memory') runMemorySync(node, choice);
    else runReactSync(node, choice);
  });
}

/* ── React-mode SYNC: shrinking ring, one glyph at a time ── */
function runReactSync(node, choice) {
  var N = node.sync.length, D = node.sync.duration;
  var hits = 0, lates = 0, misses = 0, i = 0, prevGlyph = null, active = true, startTime = 0, currentGlyph = null;

  function frameHtml() {
    return (
      '<div class="panel" style="text-align:center;">' +
        '<p class="eyebrow magenta">' + node.sync.label + '</p>' +
        '<p class="sync-sub">' + (i + 1) + ' / ' + N + '</p>' +
        '<div class="sync-arena">' +
          '<div class="ring-wrap"><div class="ring-track"></div><div class="ring-fill" id="ring-fill"></div><div class="ring-glyph" id="ring-glyph"></div></div>' +
          dpadHtml() +
          '<div class="key-hint">Arrow keys / WASD, or tap</div>' +
        '</div>' +
      '</div>'
    );
  }
  setScreen(frameHtml());
  bindDpad(handleInput);
  document.addEventListener('keydown', keyHandler);

  function nextPrompt() {
    if (i >= N) return finish();
    currentGlyph = randomGlyph(prevGlyph); prevGlyph = currentGlyph;
    var sub = stage.querySelector('.sync-sub'); if (sub) sub.textContent = (i + 1) + ' / ' + N;
    var glyphEl = document.getElementById('ring-glyph'); var fillEl = document.getElementById('ring-fill');
    glyphEl.textContent = currentGlyph.sym; glyphEl.className = 'ring-glyph';
    fillEl.className = 'ring-fill';
    fillEl.style.transition = 'none'; fillEl.style.transform = 'scale(1)';
    void fillEl.offsetWidth;
    fillEl.style.transition = 'transform ' + D + 'ms linear';
    fillEl.style.transform = 'scale(0)';
    startTime = performance.now();
    active = true;
    timers.push(setTimeout(function () { if (active) resolvePrompt('miss'); }, D));
  }

  function resolvePrompt(kind) {
    active = false;
    var glyphEl = document.getElementById('ring-glyph'); var fillEl = document.getElementById('ring-fill');
    if (kind === 'hit') { hits++; glyphEl.classList.add('flash-hit'); }
    else if (kind === 'late') { lates++; glyphEl.classList.add('flash-late'); fillEl.classList.add('late'); }
    else { misses++; glyphEl.classList.add('flash-miss'); }
    i++;
    timers.push(setTimeout(nextPrompt, 180));
  }

  function handleInput(dirKey) {
    if (!active || !currentGlyph) return;
    if (dirKey !== currentGlyph.key) { resolvePrompt('miss'); return; }
    var elapsed = performance.now() - startTime;
    resolvePrompt(elapsed <= D * 0.9 ? 'hit' : 'late');
  }
  function keyHandler(e) {
    var g = glyphByKey(e.key);
    if (g) { e.preventDefault(); handleInput(g.key); }
  }

  function finish() {
    document.removeEventListener('keydown', keyHandler);
    var result = classify(hits, lates, misses, N);
    settleSync(node, choice, result);
  }
  nextPrompt();
}

/* ── Memory-mode SYNC: flash a pattern, then repeat it ── */
function runMemorySync(node, choice) {
  var N = node.sync.length;
  var pattern = [];
  for (var k = 0; k < N; k++) pattern.push(randomGlyph(pattern[k - 1]));

  setScreen(
    '<div class="panel" style="text-align:center;">' +
      '<p class="eyebrow magenta">' + node.sync.label + '</p>' +
      '<p class="sync-sub" id="phase-label">Memorise the pattern…</p>' +
      '<div class="sync-arena">' +
        '<div class="ring-wrap"><div class="ring-track"></div><div class="ring-glyph" id="ring-glyph" style="z-index:2;"></div></div>' +
        '<div class="memory-row" id="memory-row"></div>' +
      '</div>' +
    '</div>'
  );
  var row = document.getElementById('memory-row');
  row.innerHTML = pattern.map(function () { return '<div class="memory-slot"></div>'; }).join('');
  var slots = row.querySelectorAll('.memory-slot');
  var glyphEl = document.getElementById('ring-glyph');

  var idx = 0;
  function flashStep() {
    if (idx >= pattern.length) { timers.push(setTimeout(startRecall, 300)); return; }
    glyphEl.textContent = pattern[idx].sym;
    slots[idx].classList.add('active');
    timers.push(setTimeout(function () {
      glyphEl.textContent = '';
      slots[idx].classList.remove('active');
      idx++;
      timers.push(setTimeout(flashStep, node.sync.gapMs));
    }, node.sync.flashMs));
  }
  timers.push(setTimeout(flashStep, 500));

  function startRecall() {
    document.getElementById('phase-label').textContent = 'Repeat it back';
    glyphEl.textContent = '?';
    var arena = stage.querySelector('.sync-arena');
    var bar = document.createElement('div');
    bar.className = 'progress-bar';
    bar.innerHTML = '<div class="progress-fill" id="progress-fill"></div>';
    arena.appendChild(bar);
    var dpadHolder = document.createElement('div');
    dpadHolder.innerHTML = dpadHtml() + '<div class="key-hint">Arrow keys / WASD, or tap</div>';
    arena.appendChild(dpadHolder);
    bindDpad(handleInput);
    document.addEventListener('keydown', keyHandler);

    var totalMs = pattern.length * node.sync.recallPerGlyph;
    var fill = document.getElementById('progress-fill');
    fill.style.transition = 'none'; fill.style.transform = 'scaleX(1)';
    void fill.offsetWidth;
    fill.style.transition = 'transform ' + totalMs + 'ms linear';
    fill.style.transform = 'scaleX(0)';

    var pos = 0, misses = 0, active = true;
    timers.push(setTimeout(function () { if (active) timeout(); }, totalMs));

    function handleInput(dirKey) {
      if (!active || pos >= pattern.length) return;
      var expected = pattern[pos];
      if (dirKey === expected.key) slots[pos].classList.add('hit');
      else { slots[pos].classList.add('miss'); misses++; }
      pos++;
      if (pos >= pattern.length) finish();
    }
    function keyHandler(e) { var g = glyphByKey(e.key); if (g) { e.preventDefault(); handleInput(g.key); } }
    function timeout() {
      active = false;
      while (pos < pattern.length) { slots[pos].classList.add('miss'); misses++; pos++; }
      finish();
    }
    function finish() {
      active = false;
      document.removeEventListener('keydown', keyHandler);
      settleAfterDelay();
    }
    function settleAfterDelay() {
      var result = classify(pattern.length - misses, 0, misses, pattern.length);
      timers.push(setTimeout(function () { settleSync(node, choice, result); }, 250));
    }
  }
}

function dpadHtml() {
  return (
    '<div class="dpad">' +
      '<button class="d-up" data-dir="up">▲</button>' +
      '<button class="d-left" data-dir="left">◀</button>' +
      '<button class="d-down" data-dir="down">▼</button>' +
      '<button class="d-right" data-dir="right">▶</button>' +
    '</div>'
  );
}
function bindDpad(handler) {
  Array.prototype.forEach.call(stage.querySelectorAll('.dpad button'), function (btn) {
    btn.addEventListener('click', function () { handler(btn.dataset.dir); });
  });
}

/* ── Resolve a SYNC outcome, apply consequences, show interstitial ── */
function settleSync(node, choice, result) {
  state.syncLog.push(result);
  if (result === 'fail' && node.onFail) node.onFail(state);
  if (result === 'partial' && node.onPartial) node.onPartial(state);
  updateHuntedMeter();

  var isFinal = node.id === 'final';
  var bodyText = isFinal ? '' : node.outcomes[result](choice);
  var resultLabel = result === 'clean' ? 'CLEAN SYNC' : result === 'partial' ? 'PARTIAL SYNC' : 'SYNC FAILED';
  var resultColor = result === 'clean' ? 'var(--cyan)' : result === 'partial' ? 'var(--amber)' : 'var(--danger)';
  var resultAccent = result === 'clean' ? '#22e6d4' : result === 'partial' ? '#ffcf3d' : '#ff4d4d';
  setBackdrop(resultAccent, node.art.motif, true);

  setScreen(
    '<div class="panel">' +
      '<p class="eyebrow" style="color:' + resultColor + '">' + resultLabel + '</p>' +
      (bodyText ? '<div class="prose"><p>' + bodyText + '</p></div>' : '') +
      '<button class="primary-btn" id="continue-btn">Continue</button>' +
    '</div>'
  );
  document.getElementById('continue-btn').addEventListener('click', function () {
    if (isFinal) { renderEnding(choice.id, result); return; }
    state.nodeIndex++;
    if (state.flags.hunted >= 3) { renderEnding(null, null); return; }
    renderNode();
  });
}

function computeEnding(choiceId, syncResult) {
  if (choiceId === null) return 'hunted-down';
  if (syncResult === 'fail') return 'reconditioned';
  if (state.flags.betrayed && syncResult !== 'clean') return 'betrayed';

  var methodDom = dominant(state.flags.method, ['stealth', 'words', 'violence']);
  var trustDom = dominant(state.flags.trust, ['street', 'self', 'corp']);

  if (choiceId === 'merge') return 'merged';
  if (choiceId === 'destroy') return 'walk-away';
  if (choiceId === 'vanish') {
    if (methodDom === 'violence') return 'vigilante';
    if (methodDom === 'stealth' && state.flags.hunted === 0) return 'ghost';
    return 'walk-away';
  }
  if (choiceId === 'broadcast') return (syncResult === 'clean' && trustDom === 'street') ? 'revolution-spark' : 'martyr';
  if (choiceId === 'corp') return 'corporate-puppet';
  return 'walk-away';
}

function renderEnding(choiceId, syncResult) {
  clearTimers();
  var key = computeEnding(choiceId, syncResult);
  var ending = ENDINGS[key];
  setBackdrop(ending.art.accent, ending.art.motif, true);
  var trustDom = dominant(state.flags.trust, ['street', 'self', 'corp']);
  var methodDom = dominant(state.flags.method, ['stealth', 'words', 'violence']);
  var logHtml = state.syncLog.map(function (r) { return '<span class="' + r + '"></span>'; }).join('');

  setScreen(
    '<div class="panel">' +
      '<p class="eyebrow magenta">Ending reached</p>' +
      '<h1 class="title glitch" data-text="' + ending.title + '">' + ending.title + '</h1>' +
      '<p class="tagline" style="font-style:italic;">' + ending.tag + '</p>' +
      '<div class="prose"><p>' + ending.body + '</p></div>' +
      '<div class="flag-grid">' +
        '<div class="flag-box"><div class="fk">Trust leaning</div><div class="fv">' + trustDom.toUpperCase() + '</div></div>' +
        '<div class="flag-box"><div class="fk">Method leaning</div><div class="fv">' + methodDom.toUpperCase() + '</div></div>' +
        '<div class="flag-box"><div class="fk">Hunted level</div><div class="fv">' + Math.min(state.flags.hunted, 3) + ' / 3</div></div>' +
        '<div class="flag-box"><div class="fk">SYNC record</div><div class="sync-log">' + logHtml + '</div></div>' +
      '</div>' +
      '<button class="primary-btn" id="again-btn">Run It Back</button>' +
      '<a class="ghost-btn" href="/apps/static-protocol/" style="margin-left:10px;">Exit to briefing</a>' +
    '</div>'
  );
  document.getElementById('again-btn').addEventListener('click', renderTitle);
}

renderTitle();
</script>
</body>
</html>
