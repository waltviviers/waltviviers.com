<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>Static Protocol — Play</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050a; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    color: #d9f7f2;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  :root {
    --cyan: #22e6d4;
    --cyan-dim: rgba(34,230,212,0.28);
    --magenta: #ff3d94;
    --amber: #ffcf3d;
    --danger: #ff4d4d;
    --bg: #05050a;
    --panel: #0b0c16;
    --panel-line: rgba(34,230,212,0.22);
  }

  /* Custom hand pointer, site-wide */
  html, body, body * { cursor: url('/images/pointer_up.png') 3 1, auto !important; }
  body *:active { cursor: url('/images/pointer_down.png') 3 1, auto !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ── The device: everything lives inside this phone, on purpose ── */
  .device-wrap {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 15%, #0d0e1a 0%, #030304 72%);
    display: flex; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  .phone {
    position: relative;
    width: min(94vw, 400px, calc((100vh - 60px) * 0.4615));
    aspect-ratio: 9 / 19.5;
    background: #05050a;
    border-radius: 42px;
    border: 10px solid #16171f;
    box-shadow: 0 0 0 1px rgba(34,230,212,0.15), 0 40px 100px rgba(0,0,0,0.7), 0 0 70px rgba(34,230,212,0.06);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 38%; height: 20px; background: #16171f; border-radius: 0 0 14px 14px; z-index: 80;
  }
  /* On an actual phone, a drawn bezel is a phone showing a picture of a phone — pointless. Go edge-to-edge and let the real device be the device. */
  @media (max-width: 480px) {
    .device-wrap { padding: 0; background: var(--bg); }
    .phone {
      width: 100vw; height: 100vh; height: 100dvh;
      max-width: none; aspect-ratio: unset;
      border: none; border-radius: 0; box-shadow: none;
    }
    .notch { display: none; }
    .status-bar {
      padding-top: max(13px, env(safe-area-inset-top));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }
    .home-indicator { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  }
  .status-bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 24px 20px 6px; font-size: 11.5px; letter-spacing: 0.02em; position: relative; z-index: 60;
  }
  .status-exit {
    font-size: 9.5px; letter-spacing: 0.10em; text-transform: uppercase;
    color: rgba(217,247,242,0.4); text-decoration: none; transition: color 0.2s;
  }
  .status-exit:hover { color: var(--cyan); }
  .status-right { display: flex; align-items: center; gap: 7px; }
  .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
  .signal-bars i { width: 3px; display: block; background: rgba(217,247,242,0.22); border-radius: 1px; }
  .signal-bars i:nth-child(1) { height: 4px; } .signal-bars i:nth-child(2) { height: 7px; } .signal-bars i:nth-child(3) { height: 10px; }
  .signal-bars i.on { background: var(--danger); box-shadow: 0 0 4px var(--danger); }
  .battery { width: 21px; height: 10px; border: 1px solid rgba(217,247,242,0.4); border-radius: 2px; padding: 1.5px; position: relative; }
  .battery::after { content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 4px; background: rgba(217,247,242,0.4); border-radius: 0 1px 1px 0; }
  .battery-fill { height: 100%; background: var(--cyan); border-radius: 0.5px; }

  #phone-screen { flex: 1 1 auto; overflow-y: auto; position: relative; }
  .home-indicator { flex: 0 0 auto; display: flex; justify-content: center; padding: 8px 0 12px; }
  .home-indicator span { width: 110px; height: 4px; border-radius: 3px; background: rgba(217,247,242,0.28); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: rgba(34,230,212,0.25); }

  /* ── Lock screen ── */
  .lock-screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .lock-time { font-size: 46px; font-weight: 300; margin-bottom: 4px; letter-spacing: -0.02em; }
  .lock-date { font-size: 11px; color: rgba(217,247,242,0.45); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 46px; }
  .lock-brand { font-size: 1.3rem; font-weight: 800; letter-spacing: 0.06em; margin-bottom: 10px; }
  .lock-copy { font-size: 11.5px; color: rgba(217,247,242,0.5); max-width: 240px; line-height: 1.7; }
  .lock-hint { font-size: 10.5px; color: rgba(217,247,242,0.4); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 56px; animation: hintPulse 2s ease-in-out infinite; }
  @keyframes hintPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  /* ── Home screen ── */
  .home-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; padding: 30px 18px 10px; }
  .app-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; color: inherit; position: relative; }
  .app-icon .tile {
    width: 52px; height: 52px; border-radius: 15px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
  }
  .app-icon .tile svg { width: 24px; height: 24px; stroke: var(--accent, rgba(217,247,242,0.65)); color: var(--accent, rgba(217,247,242,0.65)); }
  .app-icon.is-active .tile { border-color: var(--accent, var(--cyan)); animation: tilePulse 1.8s ease-in-out infinite; }
  .app-icon:active .tile { transform: scale(0.94); }
  .app-icon .label { font-size: 9.5px; letter-spacing: 0.03em; color: rgba(217,247,242,0.55); }
  .app-icon .badge {
    position: absolute; top: -3px; right: 6px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
    background: var(--danger); color: #fff; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 8px rgba(255,77,77,0.6);
  }
  @keyframes tilePulse { 0%, 100% { box-shadow: 0 0 14px var(--accent-glow, rgba(34,230,212,0.35)); } 50% { box-shadow: 0 0 24px var(--accent-glow, rgba(34,230,212,0.6)); } }

  /* ── Notification banner ── */
  .notif-banner {
    position: absolute; top: 8px; left: 8px; right: 8px; z-index: 90;
    background: rgba(16,17,26,0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px 12px;
    display: flex; gap: 10px; align-items: flex-start;
    transform: translateY(-140%); transition: transform 0.35s cubic-bezier(0.2,0.8,0.2,1);
  }
  .notif-banner.show { transform: translateY(0); }
  .notif-banner .nicon { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .notif-banner .nicon svg { width: 15px; height: 15px; }
  .notif-banner .nbody b { display: block; font-size: 11px; letter-spacing: 0.02em; }
  .notif-banner .nbody span { font-size: 10.5px; color: rgba(217,247,242,0.65); }

  /* ── App chrome ── */
  .app-screen { min-height: 100%; display: flex; flex-direction: column; }
  .app-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); flex: 0 0 auto; }
  .app-header .aicon { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .app-header .aicon svg { width: 16px; height: 16px; }
  .app-header .aname { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; }
  .back-btn { background: none; border: none; color: inherit; font-size: 16px; padding: 0 4px 0 0; line-height: 1; }
  .app-body { padding: 16px 18px 26px; flex: 1 1 auto; }

  /* ── Messages ── */
  .bubble-row { display: flex; margin-bottom: 10px; }
  .bubble-row.out { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px 13px; border-radius: 16px; font-size: 12.5px; line-height: 1.55; }
  .bubble-row.in .bubble { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.14); border-bottom-left-radius: 4px; }
  .bubble-row.out .bubble { background: var(--cyan); color: #05050a; border-bottom-right-radius: 4px; }
  .quick-replies { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .quick-reply { text-align: left; padding: 11px 14px; border-radius: 14px; border: 1px solid rgba(34,230,212,0.45); background: rgba(34,230,212,0.10); font-size: 12.5px; }
  .quick-reply:active { background: rgba(34,230,212,0.12); }

  /* ── Tracker ── */
  .radar-wrap { display: flex; justify-content: center; padding: 6px 0 20px; }
  .radar { position: relative; width: 148px; height: 148px; border-radius: 50%; border: 1px solid rgba(34,230,212,0.25); background: radial-gradient(circle, rgba(34,230,212,0.06), transparent 70%); }
  .radar::before, .radar::after { content: ''; position: absolute; border: 1px solid rgba(34,230,212,0.12); border-radius: 50%; }
  .radar::before { inset: 24px; } .radar::after { inset: 48px; }
  .radar .you { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .radar .blip { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: blipPing 1.6s ease-in-out infinite; }
  @keyframes blipPing { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.55; } }
  .log-line { font-size: 12px; line-height: 1.75; color: rgba(217,247,242,0.72); margin-bottom: 8px; }
  .log-line::before { content: '> '; color: var(--cyan); }

  /* ── Breach terminal ── */
  .terminal { background: #020203; border: 1px solid rgba(34,230,212,0.2); border-radius: 8px; padding: 12px 14px; font-size: 11.5px; line-height: 1.75; color: var(--cyan); margin-bottom: 18px; }
  .terminal .tline::before { content: '$ '; opacity: 0.55; }

  /* ── Generic action list (tracker / breach / transmit / call) ── */
  .action-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; width: 100%; }
  .action-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); text-align: left; font-size: 12.5px; }
  .action-row .aicon2 { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .action-row .aicon2 svg { width: 30px; height: 30px; }
  .action-row:active { background: rgba(34,230,212,0.1); }

  /* ── Call screen ── */
  .call-screen { display: flex; flex-direction: column; align-items: center; padding: 44px 20px 22px; min-height: 100%; }
  .call-avatar { width: 88px; height: 88px; border-radius: 50%; background: rgba(255,77,77,0.12); border: 1px solid rgba(255,77,77,0.4); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; animation: ringPulse 1.4s ease-in-out infinite; }
  .call-avatar svg { width: 34px; height: 34px; stroke: var(--danger); }
  @keyframes ringPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.4); } 50% { box-shadow: 0 0 0 14px rgba(255,77,77,0); } }
  .call-name { font-size: 14px; letter-spacing: 0.05em; margin-bottom: 3px; }
  .call-sub { font-size: 10.5px; color: rgba(217,247,242,0.5); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 18px; }
  .call-copy { font-size: 12px; line-height: 1.7; color: rgba(217,247,242,0.7); text-align: center; max-width: 280px; margin-bottom: 22px; }

  /* ── Result dialog ── */
  .dialog-overlay { position: absolute; inset: 0; background: rgba(2,2,4,0.74); display: flex; align-items: center; justify-content: center; padding: 22px; z-index: 95; }
  .dialog-card { width: 100%; background: #12131c; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 22px 20px; text-align: center; }
  .dialog-card .dtitle { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; }
  .dialog-card .dbody { font-size: 12.5px; line-height: 1.7; color: rgba(217,247,242,0.8); margin-bottom: 18px; }
  .dialog-ok { width: 100%; padding: 12px; border-radius: 10px; background: var(--cyan); color: #05050a; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11.5px; border: none; }

  .glitch {
    position: relative; font-weight: 800; letter-spacing: 0.02em; color: #eafffb;
    text-shadow: 0 0 18px rgba(34,230,212,0.35);
  }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; opacity: 0.7; }
  .glitch::before { color: var(--cyan); transform: translate(-1px,0); animation: glitch1 3.2s infinite steps(1); clip-path: inset(0 0 55% 0); }
  .glitch::after  { color: var(--magenta); transform: translate(1px,0); animation: glitch2 3.6s infinite steps(1); clip-path: inset(55% 0 0 0); }
  @keyframes glitch1 { 0%,90%,100% { transform: translate(-1px,0); } 92% { transform: translate(2px,-1px); } 94% { transform: translate(-3px,1px); } 96% { transform: translate(1px,1px); } }
  @keyframes glitch2 { 0%,88%,100% { transform: translate(1px,0); } 91% { transform: translate(-2px,1px); } 95% { transform: translate(3px,-1px); } 97% { transform: translate(-1px,-1px); } }

  .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan); margin-bottom: 12px; }
  .eyebrow.magenta { color: var(--magenta); }
  h1.title { font-size: 1.7rem; line-height: 1.1; margin-bottom: 12px; }
  .tagline { color: rgba(217,247,242,0.65); font-size: 12.5px; margin-bottom: 20px; line-height: 1.6; }
  .prose p { color: rgba(217,247,242,0.82); font-size: 12.5px; line-height: 1.75; margin-bottom: 14px; }
  .prose p:last-child { margin-bottom: 0; }

  .primary-btn {
    display: flex; width: 100%; align-items: center; justify-content: center;
    background: var(--cyan); color: #05050a; font-weight: 700; letter-spacing: 0.10em;
    text-transform: uppercase; font-size: 12px; padding: 14px; border: none; margin-top: 6px;
    box-shadow: 0 0 20px rgba(34,230,212,0.3);
  }
  .primary-btn:active { transform: scale(0.98); }
  .ghost-btn {
    display: block; text-align: center; background: none; border: 1px solid var(--panel-line); color: rgba(217,247,242,0.7);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 12px; margin-top: 10px; text-decoration: none;
  }

  /* ── Sync arena (reused across every node's SYNC moment) ── */
  .sync-label { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--magenta); text-align: center; margin-bottom: 6px; }
  .sync-sub { font-size: 10.5px; color: rgba(217,247,242,0.45); text-align: center; margin-bottom: 22px; letter-spacing: 0.05em; }
  .sync-arena { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .ring-wrap { position: relative; width: 116px; height: 116px; display: flex; align-items: center; justify-content: center; }
  .ring-track, .ring-fill { position: absolute; inset: 0; border-radius: 50%; }
  .ring-track { border: 2px solid rgba(217,247,242,0.12); }
  .ring-fill { border: 2px solid var(--cyan); box-shadow: 0 0 16px rgba(34,230,212,0.5); transform: scale(1); transition: transform linear, border-color linear; }
  .ring-fill.late { border-color: var(--amber); box-shadow: 0 0 16px rgba(255,207,61,0.5); }
  .ring-glyph { position: relative; z-index: 2; font-size: 30px; font-weight: 800; color: #eafffb; }
  .ring-glyph.flash-hit { color: var(--cyan); }
  .ring-glyph.flash-miss { color: var(--danger); }
  .ring-glyph.flash-late { color: var(--amber); }

  .memory-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 300px; }
  .memory-slot {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(217,247,242,0.18); font-size: 14px; font-weight: 700; color: rgba(217,247,242,0.3);
  }
  .memory-slot.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(34,230,212,0.5); background: rgba(34,230,212,0.08); }
  .memory-slot.hit { border-color: var(--cyan); color: var(--cyan); background: rgba(34,230,212,0.12); }
  .memory-slot.miss { border-color: var(--danger); color: var(--danger); background: rgba(255,77,77,0.10); }

  .progress-bar { width: 230px; height: 4px; background: rgba(217,247,242,0.12); position: relative; overflow: hidden; }
  .progress-fill { position: absolute; inset: 0; background: var(--cyan); transform-origin: left; transform: scaleX(1); transition: transform linear; }

  .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 7px; justify-content: center; }
  .dpad button { background: rgba(34,230,212,0.05); border: 1px solid var(--panel-line); color: #eafffb; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .dpad button:active { transform: scale(0.92); background: rgba(34,230,212,0.18); }
  .dpad .d-up { grid-column: 2; grid-row: 1; }
  .dpad .d-left { grid-column: 1; grid-row: 2; }
  .dpad .d-down { grid-column: 2; grid-row: 2; }
  .dpad .d-right { grid-column: 3; grid-row: 2; }
  .key-hint { font-size: 9.5px; color: rgba(217,247,242,0.35); letter-spacing: 0.06em; text-align: center; }

  .flag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
  .flag-box { border: 1px solid var(--panel-line); padding: 10px 12px; }
  .flag-box .fk { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(217,247,242,0.4); margin-bottom: 5px; }
  .flag-box .fv { font-size: 12px; color: var(--cyan); }
  .sync-log { display: flex; gap: 5px; margin-top: 2px; }
  .sync-log span { width: 8px; height: 8px; border-radius: 50%; }
  .sync-log span.clean { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .sync-log span.partial { background: var(--amber); }
  .sync-log span.fail { background: var(--danger); }

  .screen { display: block; animation: fadein 0.3s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="device-wrap">
  <div class="phone">
    <div class="notch" aria-hidden="true"></div>
    <div class="status-bar">
      <a href="/apps/static-protocol/" class="status-exit">← Exit</a>
      <span id="clock-time">23:47</span>
      <div class="status-right">
        <div class="signal-bars" id="signal-bars" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="battery" aria-hidden="true"><div class="battery-fill" id="battery-fill" style="width:100%"></div></div>
      </div>
    </div>
    <div id="phone-screen"></div>
    <div class="home-indicator" aria-hidden="true"><span></span></div>
  </div>
</div>

<script>
'use strict';

/* ── Glyph set (react + memory SYNC input) ── */
var GLYPHS = [
  { sym: '▲', key: 'up',    keys: ['ArrowUp','w','W'] },
  { sym: '▼', key: 'down',  keys: ['ArrowDown','s','S'] },
  { sym: '◀', key: 'left',  keys: ['ArrowLeft','a','A'] },
  { sym: '▶', key: 'right', keys: ['ArrowRight','d','D'] }
];
function glyphByKey(k) { for (var i=0;i<GLYPHS.length;i++) if (GLYPHS[i].keys.indexOf(k) !== -1) return GLYPHS[i]; return null; }
function randomGlyph(prev) {
  var g;
  do { g = GLYPHS[Math.floor(Math.random()*GLYPHS.length)]; } while (GLYPHS.length > 1 && prev && g.key === prev.key);
  return g;
}

/* ── Choice icons: the object/person each option is about ── */
var ICONS = {

/* ── State ── */
var state, timers = [];
function freshState() {
  return {
    nodeIndex: 0,
    lastChoice: null,
    flags: {
      trust: { corp: 0, street: 0, self: 0 },
      method: { stealth: 0, violence: 0, words: 0 },
      hunted: 0,
      betrayed: false,
      hurt: false,
      aiAlly: false
    },
    syncLog: []
  };
}
function clearTimers() { timers.forEach(function (t) { clearTimeout(t); }); timers = []; }
function addFlags(target, delta) { for (var k in delta) { if (Object.prototype.hasOwnProperty.call(delta, k)) target[k] = (target[k] || 0) + delta[k]; } }
function dominant(obj, order) {
  var best = order[0], bestVal = obj[order[0]] || 0;
  for (var i = 1; i < order.length; i++) { var v = obj[order[i]] || 0; if (v > bestVal) { best = order[i]; bestVal = v; } }
  return best;
}
function allZero(obj) { for (var k in obj) if (obj[k]) return false; return true; }

function classify(hits, lates, misses, N) {
  var failThreshold = Math.ceil(N / 2);
  if (misses >= failThreshold) return 'fail';
  if (misses === 0 && lates === 0) return 'clean';
  return 'partial';
}

/* ── Status bar (persistent — signal bars double as the Hunted meter) ── */
function updateStatusBar() {
  var hunted = state ? Math.min(state.flags.hunted, 3) : 0;
  var bars = '';
  for (var i = 0; i < 3; i++) bars += '<i class="' + (i < hunted ? 'on' : '') + '"></i>';
  var sb = document.getElementById('signal-bars'); if (sb) sb.innerHTML = bars;
  var batt = document.getElementById('battery-fill'); if (batt) batt.style.width = batteryPct() + '%';
}
function batteryPct() { var idx = state ? state.nodeIndex : 0; return Math.max(14, 100 - idx * 17); }
function tickClock() {
  function paint() {
    var el = document.getElementById('clock-time');
    if (el) el.textContent = new Date().toTimeString().slice(0, 5);
  }
  paint();
  setInterval(paint, 15000);
}
function formattedDate() {
  var d = new Date();
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
}

/* ── Rendering ── */
var phoneScreen = document.getElementById('phone-screen');
function setPhoneScreen(html) { phoneScreen.innerHTML = '<div class="screen">' + html + '</div>'; phoneScreen.scrollTop = 0; }

function appHeaderHtml(appDef) {
  return '<div class="app-header"><span class="aicon" style="color:' + appDef.color + '">' + appIconSvg(appDef.icon) + '</span><span class="aname">' + appDef.name + '</span></div>';
}
function screenHeaderHtml(node) {
  if (node.app === 'call') {
    return '<div class="app-header"><span class="aicon" style="color:' + node.art.accent + '">' + appIconSvg('tracker') + '</span><span class="aname">Call — ' + node.caller + '</span></div>';
  }
  return appHeaderHtml(appById(node.app));
}
function actionListHtml(node) {
  return '<div class="action-list">' + node.choices.map(function (c, i) {
    return '<button class="action-row" data-idx="' + i + '"><span class="aicon2" style="color:' + node.art.accent + '">' + choiceIconSvg(c.icon, node.art.accent) + '</span>' + c.label + '</button>';
  }).join('') + '</div>';
}
function bindChoiceControls(node) {
  Array.prototype.forEach.call(phoneScreen.querySelectorAll('.quick-reply, .action-row'), function (btn) {
    btn.addEventListener('click', function () { activateChoice(node, Number(btn.dataset.idx)); });
  });
}

function renderLock() {
  clearTimers();
  setPhoneScreen(
    '<div class="lock-screen">' +
      '<div class="lock-time" id="lock-time-face">--:--</div>' +
      '<div class="lock-date">' + formattedDate() + '</div>' +
      '<div class="lock-brand glitch" data-text="STATIC PROTOCOL">STATIC PROTOCOL</div>' +
      '<div class="lock-copy">This is the runner\'s phone. Five jobs come through tonight — however you handle them, on this screen, is however this goes.</div>' +
      '<div class="lock-hint">Tap to unlock</div>' +
    '</div>'
  );
  var lf = document.getElementById('lock-time-face'); if (lf) lf.textContent = new Date().toTimeString().slice(0, 5);
  phoneScreen.querySelector('.lock-screen').addEventListener('click', function () {
    state = freshState();
    updateStatusBar();
    renderHome();
    queueNotification(state.nodeIndex);
  });
}

  updateStatusBar();
  var activeApp = (state && state.nodeIndex < NODES.length) ? NODES[state.nodeIndex].app : null;
  var iconsHtml = APPS.map(function (a) {
    var isActive = a.id === activeApp;
    return (
      '<button class="app-icon' + (isActive ? ' is-active' : '') + '" data-app="' + a.id + '" style="--accent:' + a.color + '; --accent-glow:' + a.color + '55;">' +
        '<span class="tile">' + appIconSvg(a.icon) + (isActive ? '<span class="badge">1</span>' : '') + '</span>' +
        '<span class="label">' + a.name + '</span>' +
      '</button>'
    );
  }).join('');
  setPhoneScreen('<div class="home-screen"><div class="home-grid">' + iconsHtml + '</div></div>');
  Array.prototype.forEach.call(phoneScreen.querySelectorAll('.app-icon'), function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.dataset.app;
      if (id === activeApp) { openCurrentNode(); }
      else if (id === 'status') { renderStatusApp(); }
      else if (id === 'camera') { renderInert('Camera', 'No photos yet. Nothing on this roll — you\'ve been busy.'); }
      else if (id === 'notes') { renderInert('Notes', 'STEAL DRIVE. DON\'T DIE.\n\nJob notes, from the last time you thought you could plan for this.'); }
    });
  });
}

function renderInert(title, body) {
  setPhoneScreen(
    '<div class="app-screen">' +
      '<div class="app-header"><button class="back-btn" id="back-home">←</button><span class="aname">' + title + '</span></div>' +
      '<div class="app-body"><p style="font-size:12.5px;line-height:1.8;color:rgba(217,247,242,0.7);white-space:pre-line;">' + body + '</p></div>' +
    '</div>'
  );
  document.getElementById('back-home').addEventListener('click', renderHome);
}

function renderStatusApp() {
  var trustDom = allZero(state.flags.trust) ? 'UNASSIGNED' : dominant(state.flags.trust, ['street', 'self', 'corp']).toUpperCase();
  var methodDom = allZero(state.flags.method) ? 'UNASSIGNED' : dominant(state.flags.method, ['stealth', 'words', 'violence']).toUpperCase();
  setPhoneScreen(
    '<div class="app-screen">' +
      '<div class="app-header"><button class="back-btn" id="back-home">←</button><span class="aname">Status</span></div>' +
      '<div class="app-body">' +
        '<div class="flag-grid" style="grid-template-columns:1fr;">' +
          '<div class="flag-box"><div class="fk">Network Affinity</div><div class="fv">' + trustDom + '</div></div>' +
          '<div class="flag-box"><div class="fk">Behaviour Profile</div><div class="fv">' + methodDom + '</div></div>' +
          '<div class="flag-box"><div class="fk">Threat Detection</div><div class="fv">' + Math.min(state.flags.hunted, 3) + ' / 3</div></div>' +
          '<div class="flag-box"><div class="fk">Battery</div><div class="fv">' + batteryPct() + '%</div></div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('back-home').addEventListener('click', renderHome);
}

/* ── Notifications route the player into the right app for the current node ── */
function showBanner(appDef, title, body, onTap) {
  var home = phoneScreen.querySelector('.home-screen');
  if (!home) return;
  var el = document.createElement('div');
  el.className = 'notif-banner';
  el.innerHTML = '<span class="nicon" style="color:' + appDef.color + '">' + appIconSvg(appDef.icon) + '</span><span class="nbody"><b>' + title + '</b><span>' + body + '</span></span>';
  phoneScreen.appendChild(el);
  requestAnimationFrame(function () { el.classList.add('show'); });
  el.addEventListener('click', function () { el.remove(); onTap(); });
  timers.push(setTimeout(function () {
    el.classList.remove('show');
    timers.push(setTimeout(function () { el.remove(); }, 400));
  }, 4500));
}
function queueNotification(nodeIndex) {
  if (nodeIndex >= NODES.length) return;
  var node = NODES[nodeIndex];
  if (node.app === 'call') {
    timers.push(setTimeout(function () { renderCall(node); }, 1400));
    return;
  }
  var appDef = appById(node.app);
  timers.push(setTimeout(function () { showBanner(appDef, node.notif.title, node.notif.body, openCurrentNode); }, 700));
}
function openCurrentNode() {
  var node = NODES[state.nodeIndex];
  if (node.app === 'call') { renderCall(node); return; }
  renderAppChoice(node);
}

function renderAppChoice(node) {
  clearTimers();
  var bodyHtml = '';
  if (node.app === 'messages') {
    bodyHtml =
      node.scene.map(function (p) { return '<div class="bubble-row in"><div class="bubble">' + p + '</div></div>'; }).join('') +
      '<div class="quick-replies">' + node.choices.map(function (c, i) { return '<button class="quick-reply" data-idx="' + i + '">' + c.label + '</button>'; }).join('') + '</div>';
  } else if (node.app === 'tracker') {
    bodyHtml =
      '<div class="radar-wrap"><div class="radar"><span class="you"></span><span class="blip" style="top:16%;left:68%;"></span></div></div>' +
      node.scene.map(function (p) { return '<div class="log-line">' + p + '</div>'; }).join('') +
      '<div style="height:16px;"></div>' + actionListHtml(node);
  } else if (node.app === 'breach') {
    bodyHtml = '<div class="terminal">' + node.scene.map(function (p) { return '<div class="tline">' + p + '</div>'; }).join('') + '</div>' + actionListHtml(node);
  } else if (node.app === 'transmit') {
    bodyHtml = '<p style="font-size:12.5px;line-height:1.75;color:rgba(217,247,242,0.8);margin-bottom:18px;">' + node.scene.join(' ') + '</p>' + actionListHtml(node);
  }
  setPhoneScreen('<div class="app-screen">' + screenHeaderHtml(node) + '<div class="app-body">' + bodyHtml + '</div></div>');
  bindChoiceControls(node);
}

function renderCall(node) {
  clearTimers();
  setPhoneScreen(
    '<div class="call-screen">' +
      '<div class="call-avatar">' + appIconSvg('tracker') + '</div>' +
      '<div class="call-name">' + node.caller + '</div>' +
      '<div class="call-sub">Incoming call</div>' +
      '<p class="call-copy">' + node.scene.join(' ') + '</p>' +
      actionListHtml(node) +
    '</div>'
  );
  bindChoiceControls(node);
}

function activateChoice(node, idx) {
  var choice = node.choices[idx];
  state.lastChoice = choice;
  addFlags(state.flags.method, choice.method || {});
  addFlags(state.flags.trust, choice.trust || {});
  if (node.onSelect) node.onSelect(state, choice);
  renderSyncIntro(node, choice);
}

function renderSyncIntro(node, choice) {
  setPhoneScreen(
    '<div class="app-screen">' + screenHeaderHtml(node) +
      '<div class="app-body" style="text-align:center;">' +
        '<p class="eyebrow magenta">' + node.sync.label + '</p>' +
        '<p class="sync-sub" style="margin-bottom:20px;">' + node.sync.sub + '</p>' +
        '<button class="primary-btn" id="sync-go">Initiate SYNC</button>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('sync-go').addEventListener('click', function () {
    if (node.sync.mode === 'memory') runMemorySync(node, choice);
    else runReactSync(node, choice);
  });
}

/* ── React-mode SYNC: shrinking ring, one glyph at a time ── */
function runReactSync(node, choice) {
  var N = node.sync.length, D = node.sync.duration;
  var hits = 0, lates = 0, misses = 0, i = 0, prevGlyph = null, active = true, startTime = 0, currentGlyph = null;

  function frameHtml() {
    return (
      '<div class="app-screen">' + screenHeaderHtml(node) +
        '<div class="app-body" style="text-align:center;">' +
          '<p class="eyebrow magenta">' + node.sync.label + '</p>' +
          '<p class="sync-sub">' + (i + 1) + ' / ' + N + '</p>' +
          '<div class="sync-arena">' +
            '<div class="ring-wrap"><div class="ring-track"></div><div class="ring-fill" id="ring-fill"></div><div class="ring-glyph" id="ring-glyph"></div></div>' +
            dpadHtml() +
            '<div class="key-hint">Arrow keys / WASD, or tap</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  setPhoneScreen(frameHtml());
  bindDpad(handleInput);
  document.addEventListener('keydown', keyHandler);

  function nextPrompt() {
    if (i >= N) return finish();
    currentGlyph = randomGlyph(prevGlyph); prevGlyph = currentGlyph;
    var sub = phoneScreen.querySelector('.sync-sub'); if (sub) sub.textContent = (i + 1) + ' / ' + N;
    var glyphEl = document.getElementById('ring-glyph'); var fillEl = document.getElementById('ring-fill');
    glyphEl.textContent = currentGlyph.sym; glyphEl.className = 'ring-glyph';
    fillEl.className = 'ring-fill';
    fillEl.style.transition = 'none'; fillEl.style.transform = 'scale(1)';
    void fillEl.offsetWidth;
    fillEl.style.transition = 'transform ' + D + 'ms linear';
    fillEl.style.transform = 'scale(0)';
    startTime = performance.now();
    active = true;
    timers.push(setTimeout(function () { if (active) resolvePrompt('miss'); }, D));
  }

  function resolvePrompt(kind) {
    active = false;
    var glyphEl = document.getElementById('ring-glyph'); var fillEl = document.getElementById('ring-fill');
    if (kind === 'hit') { hits++; glyphEl.classList.add('flash-hit'); }
    else if (kind === 'late') { lates++; glyphEl.classList.add('flash-late'); fillEl.classList.add('late'); }
    else { misses++; glyphEl.classList.add('flash-miss'); }
    i++;
    timers.push(setTimeout(nextPrompt, 180));
  }

  function handleInput(dirKey) {
    if (!active || !currentGlyph) return;
    if (dirKey !== currentGlyph.key) { resolvePrompt('miss'); return; }
    var elapsed = performance.now() - startTime;
    resolvePrompt(elapsed <= D * 0.9 ? 'hit' : 'late');
  }
  function keyHandler(e) {
    var g = glyphByKey(e.key);
    if (g) { e.preventDefault(); handleInput(g.key); }
  }

  function finish() {
    document.removeEventListener('keydown', keyHandler);
    var result = classify(hits, lates, misses, N);
    settleSync(node, choice, result);
  }
  nextPrompt();
}

/* ── Memory-mode SYNC: flash a pattern, then repeat it ── */
function runMemorySync(node, choice) {
  var N = node.sync.length;
  var pattern = [];
  for (var k = 0; k < N; k++) pattern.push(randomGlyph(pattern[k - 1]));

  setPhoneScreen(
    '<div class="app-screen">' + screenHeaderHtml(node) +
      '<div class="app-body" style="text-align:center;">' +
        '<p class="eyebrow magenta">' + node.sync.label + '</p>' +
        '<p class="sync-sub" id="phase-label">Memorise the pattern…</p>' +
        '<div class="sync-arena">' +
          '<div class="ring-wrap"><div class="ring-track"></div><div class="ring-glyph" id="ring-glyph" style="z-index:2;"></div></div>' +
          '<div class="memory-row" id="memory-row"></div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
  var row = document.getElementById('memory-row');
  row.innerHTML = pattern.map(function () { return '<div class="memory-slot"></div>'; }).join('');
  var slots = row.querySelectorAll('.memory-slot');
  var glyphEl = document.getElementById('ring-glyph');

  var idx = 0;
  function flashStep() {
    if (idx >= pattern.length) { timers.push(setTimeout(startRecall, 300)); return; }
    glyphEl.textContent = pattern[idx].sym;
    slots[idx].classList.add('active');
    timers.push(setTimeout(function () {
      glyphEl.textContent = '';
      slots[idx].classList.remove('active');
      idx++;
      timers.push(setTimeout(flashStep, node.sync.gapMs));
    }, node.sync.flashMs));
  }
  timers.push(setTimeout(flashStep, 500));

  function startRecall() {
    document.getElementById('phase-label').textContent = 'Repeat it back';
    glyphEl.textContent = '?';
    var arena = phoneScreen.querySelector('.sync-arena');
    var bar = document.createElement('div');
    bar.className = 'progress-bar';
    bar.innerHTML = '<div class="progress-fill" id="progress-fill"></div>';
    arena.appendChild(bar);
    var dpadHolder = document.createElement('div');
    dpadHolder.innerHTML = dpadHtml() + '<div class="key-hint">Arrow keys / WASD, or tap</div>';
    arena.appendChild(dpadHolder);
    bindDpad(handleInput);
    document.addEventListener('keydown', keyHandler);

    var totalMs = pattern.length * node.sync.recallPerGlyph;
    var fill = document.getElementById('progress-fill');
    fill.style.transition = 'none'; fill.style.transform = 'scaleX(1)';
    void fill.offsetWidth;
    fill.style.transition = 'transform ' + totalMs + 'ms linear';
    fill.style.transform = 'scaleX(0)';

    var pos = 0, misses = 0, active = true;
    timers.push(setTimeout(function () { if (active) timeout(); }, totalMs));

    function handleInput(dirKey) {
      if (!active || pos >= pattern.length) return;
      var expected = pattern[pos];
      if (dirKey === expected.key) slots[pos].classList.add('hit');
      else { slots[pos].classList.add('miss'); misses++; }
      pos++;
      if (pos >= pattern.length) finish();
    }
    function keyHandler(e) { var g = glyphByKey(e.key); if (g) { e.preventDefault(); handleInput(g.key); } }
    function timeout() {
      active = false;
      while (pos < pattern.length) { slots[pos].classList.add('miss'); misses++; pos++; }
      finish();
    }
    function finish() {
      active = false;
      document.removeEventListener('keydown', keyHandler);
      settleAfterDelay();
    }
    function settleAfterDelay() {
      var result = classify(pattern.length - misses, 0, misses, pattern.length);
      timers.push(setTimeout(function () { settleSync(node, choice, result); }, 250));
    }
  }
}

function dpadHtml() {
  return (
    '<div class="dpad">' +
      '<button class="d-up" data-dir="up">▲</button>' +
      '<button class="d-left" data-dir="left">◀</button>' +
      '<button class="d-down" data-dir="down">▼</button>' +
      '<button class="d-right" data-dir="right">▶</button>' +
    '</div>'
  );
}
function bindDpad(handler) {
  Array.prototype.forEach.call(phoneScreen.querySelectorAll('.dpad button'), function (btn) {
    btn.addEventListener('click', function () { handler(btn.dataset.dir); });
  });
}

/* ── Resolve a SYNC outcome as a system dialog, then move to the next job ── */
function settleSync(node, choice, result) {
  state.syncLog.push(result);
  if (result === 'fail' && node.onFail) node.onFail(state);
  if (result === 'partial' && node.onPartial) node.onPartial(state);
  updateStatusBar();

  var isFinal = node.id === 'final';
  var bodyText = isFinal ? '' : node.outcomes[result](choice);
  var resultLabel = result === 'clean' ? 'CLEAN SYNC' : result === 'partial' ? 'PARTIAL SYNC' : 'SYNC FAILED';
  var resultColor = result === 'clean' ? 'var(--cyan)' : result === 'partial' ? 'var(--amber)' : 'var(--danger)';

  var overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML =
    '<div class="dialog-card">' +
      '<p class="dtitle" style="color:' + resultColor + '">' + resultLabel + '</p>' +
      (bodyText ? '<p class="dbody">' + bodyText + '</p>' : '') +
      '<button class="dialog-ok" id="dialog-ok">Continue</button>' +
    '</div>';
  phoneScreen.appendChild(overlay);
  document.getElementById('dialog-ok').addEventListener('click', function () {
    if (isFinal) { renderEnding(choice.id, result); return; }
    state.nodeIndex++;
    if (state.flags.hunted >= 3) { renderEnding(null, null); return; }
    renderHome();
    queueNotification(state.nodeIndex);
  });
}

function computeEnding(choiceId, syncResult) {
  if (choiceId === null) return 'hunted-down';
  if (syncResult === 'fail') return 'reconditioned';
  if (state.flags.betrayed && syncResult !== 'clean') return 'betrayed';

  var methodDom = dominant(state.flags.method, ['stealth', 'words', 'violence']);
  var trustDom = dominant(state.flags.trust, ['street', 'self', 'corp']);

  if (choiceId === 'merge') return 'merged';
  if (choiceId === 'destroy') return 'walk-away';
  if (choiceId === 'vanish') {
    if (methodDom === 'violence') return 'vigilante';
    if (methodDom === 'stealth' && state.flags.hunted === 0) return 'ghost';
    return 'walk-away';
  }
  if (choiceId === 'broadcast') return (syncResult === 'clean' && trustDom === 'street') ? 'revolution-spark' : 'martyr';
  if (choiceId === 'corp') return 'corporate-puppet';
  return 'walk-away';
}

function renderEnding(choiceId, syncResult) {
  clearTimers();
  var key = computeEnding(choiceId, syncResult);
  var ending = ENDINGS[key];
  updateStatusBar();
  var trustDom = allZero(state.flags.trust) ? 'NONE' : dominant(state.flags.trust, ['street', 'self', 'corp']).toUpperCase();
  var methodDom = allZero(state.flags.method) ? 'NONE' : dominant(state.flags.method, ['stealth', 'words', 'violence']).toUpperCase();
  var logHtml = state.syncLog.map(function (r) { return '<span class="' + r + '"></span>'; }).join('');

  setPhoneScreen(
    '<div class="app-screen">' +
      '<div class="app-body" style="padding-top:26px;">' +
        '<p class="eyebrow magenta">Connection terminated</p>' +
        '<h1 class="title glitch" data-text="' + ending.title + '">' + ending.title + '</h1>' +
        '<p class="tagline" style="font-style:italic;">' + ending.tag + '</p>' +
        '<div class="prose"><p>' + ending.body + '</p></div>' +
        '<div class="flag-grid">' +
          '<div class="flag-box"><div class="fk">Trust leaning</div><div class="fv">' + trustDom + '</div></div>' +
          '<div class="flag-box"><div class="fk">Method leaning</div><div class="fv">' + methodDom + '</div></div>' +
          '<div class="flag-box"><div class="fk">Hunted level</div><div class="fv">' + Math.min(state.flags.hunted, 3) + ' / 3</div></div>' +
          '<div class="flag-box"><div class="fk">SYNC record</div><div class="sync-log">' + logHtml + '</div></div>' +
        '</div>' +
        '<button class="primary-btn" id="again-btn">Run It Back</button>' +
        '<a class="ghost-btn" href="/apps/static-protocol/">Exit to briefing</a>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('again-btn').addEventListener('click', renderLock);
}

tickClock();
renderLock();
</script>
</body>
</html>
