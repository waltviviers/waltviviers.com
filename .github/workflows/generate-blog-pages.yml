name: Generate journal pages

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'scripts/generate-blog.js'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate journal pages and RSS feed
        run: node scripts/generate-blog.js

      - name: Commit generated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ feed.xml
          git diff --cached --quiet || git commit -m "chore: regenerate journal pages [skip ci]"
          git push
