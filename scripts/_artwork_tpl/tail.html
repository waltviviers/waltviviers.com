  <button type="button" class="gx-fab gx-open" aria-label="Enquire now">Enquire Now</button>
  <div class="gx-modal" id="gx-enquire" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Enquire">
    <div class="gx-box">
      <button class="gx-close" type="button" aria-label="Close">&times;</button>
      <h2>Enquire</h2>
      <p class="gx-sub">Commissions, original artworks, photography &amp; video bookings, gallery representation — tell me what you have in mind and I'll be in touch.</p>
      <form id="gx-form">
        <input type="hidden" name="_subject" value="Website Enquiry" />
        <div class="gx-field"><label for="gx-name">Name</label><input id="gx-name" name="name" type="text" required placeholder="Your name" /></div>
        <div class="gx-field"><label for="gx-email">Email</label><input id="gx-email" name="email" type="email" required placeholder="your@email.com" /></div>
        <div class="gx-field"><label for="gx-about">I'm enquiring about</label><select id="gx-about" name="about"><option>Commission</option><option>Purchasing an artwork</option><option>Photography &amp; Video</option><option>Gallery representation</option><option>Something else</option></select></div>
        <div class="gx-field"><label for="gx-msg">Message</label><textarea id="gx-msg" name="message" rows="4" placeholder="Tell me what you have in mind…"></textarea></div>
        <p class="gx-err" hidden></p>
        <button type="submit" class="gx-submit">Send enquiry</button>
      </form>
      <div class="gx-success" hidden>
        <p>Thank you — your message has been sent. Walt will be in touch shortly.</p>
        <button type="button" class="gx-submit gx-close">Close</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var modal = document.getElementById('gx-enquire');
      var form = document.getElementById('gx-form');
      if (!modal || !form) return;
      var success = modal.querySelector('.gx-success');
      var err = form.querySelector('.gx-err');
      var btn = form.querySelector('[type="submit"]');
      var orig = btn.textContent;
      function openM(e) { if (e) e.preventDefault(); modal.classList.add('open'); modal.removeAttribute('aria-hidden'); document.body.style.overflow = 'hidden'; }
      function closeM() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; form.hidden = false; success.hidden = true; err.hidden = true; btn.disabled = false; btn.textContent = orig; }
      document.querySelectorAll('[data-i18n="nav-enquire"], .gx-open').forEach(function (a) { a.addEventListener('click', openM); });
      modal.addEventListener('click', function (e) { if (e.target === modal) closeM(); });
      modal.querySelectorAll('.gx-close').forEach(function (b) { b.addEventListener('click', closeM); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) closeM(); });
      form.addEventListener('submit', async function (e) {
        e.preventDefault(); btn.disabled = true; btn.textContent = '…'; err.hidden = true;
        try {
          var res = await fetch('https://formspree.io/f/mrevzark', { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } });
          if (res.ok) { form.hidden = true; success.hidden = false; }
          else { var d = await res.json(); err.textContent = (d.errors || []).map(function (x) { return x.message; }).join(', ') || 'Something went wrong. Please try again.'; err.hidden = false; btn.disabled = false; btn.textContent = orig; }
        } catch (_) { err.textContent = 'Could not send. Email artist@waltviviers.com directly.'; err.hidden = false; btn.disabled = false; btn.textContent = orig; }
      });
    })();
  </script>

  <script>
  function shareArtwork(btn){
    var data={title:document.title,text:document.title,url:location.href};
    if(navigator.share){navigator.share(data).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){var o=btn.textContent;btn.textContent='Link copied!';setTimeout(function(){btn.textContent=o;},1500);});}
  }
  </script>
