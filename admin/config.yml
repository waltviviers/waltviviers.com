backend:
  name: github
  repo: waltviviers/waltviviers.com
  branch: main
  base_url: https://waltviviers.com
  auth_endpoint: api/auth

media_folder: images
public_folder: images

locale: en

collections:
  - name: artworks
    label: Artworks
    files:
      - name: artworks
        label: Artwork List
        file: data/artworks.json
        fields:
          - name: artworks
            label: Artworks
            widget: list
            add_to_top: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: year, label: Year, widget: string, hint: "e.g. 2024" }
              - name: medium
                label: Medium
                widget: string
                required: false
                hint: "e.g. Oil on canvas"
              - name: dimensions
                label: Dimensions
                widget: string
                required: false
                hint: "e.g. 90 × 70 cm"
              - name: available
                label: Availability
                widget: select
                options:
                  - { label: "Available for sale", value: "available" }
                  - { label: "Sold", value: "sold" }
                  - { label: "Enquire", value: "enquire" }
                  - { label: "On Show", value: "on_show" }
                default: enquire
              - name: on_show_link
                label: "On Show link (optional)"
                widget: string
                required: false
                hint: "Link to exhibition or show details — only shown when Availability is set to On Show"
              - name: featured
                label: "Show first in hero"
                widget: boolean
                default: false
              - name: image
                label: Image
                widget: image
              - name: price
                label: "Price (optional)"
                widget: string
                required: false
                hint: "e.g. R4 500 or POA — leave blank to hide"
              - name: instagram
                label: "Instagram link (optional)"
                widget: string
                required: false
                hint: "e.g. https://www.instagram.com/p/ABC123/"
              - name: article
                label: "Article link (optional)"
                widget: string
                required: false
                hint: "e.g. https://example.com/interviews/walt-viviers/"
              - name: description
                label: "Description (English)"
                widget: text
                required: false
                hint: "Artwork description shown on the individual artwork page."
              - name: description_af
                label: "Description (Afrikaans)"
                widget: text
                required: false
                hint: "Afrikaans translation of the artwork description."

  - name: journal
    label: Journal
    label_singular: Post
    description: "Written essays. Leave Draft ticked to keep a post hidden; untick it to publish. Pages and the RSS feed rebuild automatically after you save."
    folder: blog/posts
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{title}}"
    identifier_field: title
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        hint: "Posts are shown newest first."
      - name: description
        label: "Summary"
        widget: text
        required: false
        hint: "One or two sentences shown on the Journal list and in the RSS feed."
      - name: draft
        label: "Draft (hidden from the site until unticked)"
        widget: boolean
        default: true
      - name: slug
        label: "Custom URL slug (optional)"
        widget: string
        required: false
        hint: "Leave blank to build the address from the title."
      - { name: body, label: "Body", widget: markdown }
